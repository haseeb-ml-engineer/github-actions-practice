name: Python CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Check out the code from repository (Upgraded to v4)
      - name: Check out code
        uses: actions/checkout@v4

      # Step 2: Set up Python Environment (Upgraded to v4)
      - name: Set up Python
        uses: actions/setup-python@v4
        with: 
          python-version: '3.11'
      
      # Step 3: Install Dependencies (Added '|' and fixed spelling)
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run Tests
      - name: Run Tests
        run: pytest
